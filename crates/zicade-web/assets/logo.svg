<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Zicade">
  <title>Zicade</title>
  <defs>
    <linearGradient id="zc-badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Gateway badge: the local proxy box -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#zc-badge)"/>

  <!-- The "Z" as a forwarding hop: client -> proxy -> origin -->
  <path d="M19 20 L45 20 L19 44 L45 44"
        fill="none" stroke="#ffffff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Endpoint nodes at the two loose ends of the path (the bridged hosts) -->
  <g>
    <circle cx="19" cy="20" r="5.2" fill="#2563eb"/>
    <circle cx="19" cy="20" r="3.3" fill="#22d3ee"/>
    <circle cx="45" cy="44" r="5.2" fill="#2563eb"/>
    <circle cx="45" cy="44" r="3.3" fill="#22d3ee"/>
  </g>
</svg>
