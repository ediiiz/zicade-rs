name: ci

# Gate every PR (and pushes to main) on formatting, lints, tests, and the
# binary build. Like the release job, CI builds with the MSVC toolchain
# preinstalled on windows-latest; `--target` names it explicitly so the job
# never depends on the runner's default host triple. The crates are
# Windows-only (windows-crate FFI), so all jobs run on Windows.

# Docs-only changes cannot affect the build, so they skip the ~5 min Windows job.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Drop the per-crate "Compiling"/"Checking" lines; warnings, errors, and test
  # failures still print.
  CARGO_TERM_QUIET: "true"
  CARGO_INCREMENTAL: "0"
  TARGET: x86_64-pc-windows-msvc

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: msvc
          # Only main saves the ~1 GB cache; PRs restore it. Per-PR caches
          # otherwise pile up against the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        shell: bash
        run: cargo fmt --all --check

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --target "$TARGET" -- -D warnings

      # Test helpers live outside `#[test]` fns, so unwrap/expect is only
      # forbidden on the shipping targets (not settable per-target in Cargo.toml).
      - name: Clippy (no unwrap/expect outside tests)
        shell: bash
        run: cargo clippy --workspace --lib --bins --target "$TARGET" -- -D warnings -D clippy::unwrap_used -D clippy::expect_used

      - name: File-size guard
        shell: bash
        run: bash scripts/check_file_size.sh

      # `apps/zicade` has integration tests, so this also builds the `zicade`
      # binary (and with it the app-icon embed); no separate build step needed.
      - name: Test
        shell: bash
        run: cargo test --workspace --locked --target "$TARGET"
