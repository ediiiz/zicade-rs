name: ci

# Gate every PR (and pushes to main) on formatting, lints, tests, and a binary
# build. Like the release job, CI builds with the MSVC toolchain preinstalled on
# windows-latest and overrides the developer-local GNU settings in
# .cargo/config.toml: `--target ...-msvc` overrides the pinned GNU target and
# `build.rustflags=[]` drops the GNU-only `-Cdlltool`. The crates are Windows-only
# (windows-crate FFI), so all jobs run on Windows.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: target
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TARGET: x86_64-pc-windows-msvc

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: msvc

      - name: Format
        shell: bash
        run: cargo fmt --all --check

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --target "$TARGET" --config "build.rustflags=[]" -- -D warnings

      # Test helpers live outside `#[test]` fns, so unwrap/expect is only
      # forbidden on the shipping targets (not settable per-target in Cargo.toml).
      - name: Clippy (no unwrap/expect outside tests)
        shell: bash
        run: cargo clippy --workspace --lib --bins --target "$TARGET" --config "build.rustflags=[]" -- -D warnings -D clippy::unwrap_used -D clippy::expect_used

      - name: File-size guard
        shell: bash
        run: bash scripts/check_file_size.sh

      - name: Test
        shell: bash
        run: cargo test --workspace --locked --target "$TARGET" --config "build.rustflags=[]"

      - name: Build binary (verifies the app-icon embed)
        shell: bash
        run: cargo build -p zicade --target "$TARGET" --config "build.rustflags=[]"
