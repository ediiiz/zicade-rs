name: release-please

# Release automation:
#   1. On every push to main, release-please maintains a rolling "release PR"
#      that accumulates conventional-commit changes and bumps the version — it
#      edits .release-please-manifest.json and, via the `x-release-please-version`
#      annotation, the workspace version in Cargo.toml, and updates CHANGELOG.md.
#   2. When that PR is merged, release-please tags the commit and creates the
#      GitHub Release; the build job then compiles the Windows release .exe,
#      packages an Inno Setup installer, and attaches both to that release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-windows-exe:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    env:
      # The repo's .cargo/config.toml targets a developer-specific w64devkit
      # (GNU) toolchain via absolute paths. CI builds natively with the MSVC
      # toolchain preinstalled on windows-latest: `--target ...-msvc` overrides
      # the pinned GNU target, `build.rustflags=[]` drops the GNU-only
      # `-Cdlltool`, and CARGO_TARGET_DIR redirects the absolute target dir into
      # the workspace. The app icon is still embedded (embed-resource uses the
      # SDK's rc.exe on MSVC).
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release binary (MSVC)
        shell: bash
        run: cargo build --release -p zicade --target x86_64-pc-windows-msvc --config "build.rustflags=[]"
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/zicade.exe" \
             "dist/zicade-${{ needs.release-please.outputs.tag_name }}-x86_64-pc-windows-msvc.exe"
      # Package the staged exe into a setup installer with Inno Setup 6.
      # Chocolatey is preinstalled on windows-latest.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer (Inno Setup)
        shell: bash
        run: |
          set -e
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          EXE="$PWD/dist/zicade-${TAG}-x86_64-pc-windows-msvc.exe"
          # Locate ISCC.exe; the install folder is not on PATH by default.
          ISCC=$(find "/c/Program Files (x86)" -name ISCC.exe -path "*Inno Setup*" | head -1)
          echo "Using ISCC at: $ISCC"
          # Double slashes stop MSYS from mangling the /D and /O switches.
          "$ISCC" //DMyAppVersion="$VERSION" //DExeSource="$(cygpath -w "$EXE")" \
            //O"$(cygpath -w "$PWD/dist")" installer/zicade.iss
      - name: Attach binary + installer to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # dist/*.exe covers both the raw zicade.exe and the *-setup.exe installer.
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*.exe --clobber
