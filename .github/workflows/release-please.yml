name: release-please

# Release automation:
#   1. On every push to main, release-please maintains a rolling "release PR"
#      that accumulates conventional-commit changes and bumps the version — it
#      edits .release-please-manifest.json and, via the `x-release-please-version`
#      annotation, the workspace version in Cargo.toml, and updates CHANGELOG.md.
#   2. When that PR is merged, release-please tags the commit and creates the
#      GitHub Release; the build job then compiles the Windows release .exe and
#      attaches it to that release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-windows-exe:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    env:
      # The repo's .cargo/config.toml targets a developer-specific w64devkit
      # (GNU) toolchain via absolute paths. CI builds natively with the MSVC
      # toolchain preinstalled on windows-latest: `--target ...-msvc` overrides
      # the pinned GNU target, `build.rustflags=[]` drops the GNU-only
      # `-Cdlltool`, and CARGO_TARGET_DIR redirects the absolute target dir into
      # the workspace. The app icon is still embedded (embed-resource uses the
      # SDK's rc.exe on MSVC).
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release binary (MSVC)
        shell: bash
        run: cargo build --release -p zicade --target x86_64-pc-windows-msvc --config "build.rustflags=[]"
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/zicade.exe" \
             "dist/zicade-${{ needs.release-please.outputs.tag_name }}-x86_64-pc-windows-msvc.exe"
      # Package the staged exe into an MSI. WiX v3 (candle/light) is driven
      # directly against the built binary — no cargo-wix, so the repo's pinned
      # GNU .cargo/config.toml never enters the picture. Chocolatey is
      # preinstalled on windows-latest.
      - name: Install WiX Toolset v3
        shell: pwsh
        run: choco install wixtoolset -y --no-progress
      - name: Build MSI installer
        shell: bash
        run: |
          set -e
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          EXE="$PWD/dist/zicade-${TAG}-x86_64-pc-windows-msvc.exe"
          # Locate the WiX v3 bin (candle/light); the folder is versioned.
          CANDLE=$(find "/c/Program Files (x86)" -name candle.exe -path "*WiX Toolset*" | head -1)
          WIX_BIN=$(dirname "$CANDLE")
          echo "Using WiX at: $WIX_BIN"
          mkdir -p build
          "$WIX_BIN/candle.exe" -arch x64 -ext WixUIExtension \
            -dVersion="$VERSION" -dExeSource="$(cygpath -w "$EXE")" \
            apps/zicade/wix/main.wxs -o build/main.wixobj
          "$WIX_BIN/light.exe" -ext WixUIExtension \
            build/main.wixobj -o "dist/zicade-${TAG}-x86_64.msi"
      - name: Attach binary + MSI to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*.exe dist/*.msi --clobber
