# w64devkit GNU toolchain. `gcc.exe` is the linker driver, but its helper tools
# (`ld`, `dlltool`) live in the same bin dir which is NOT on PATH. Make the build
# self-contained (no PATH dependency) without relying on rustflags reaching host
# build scripts (they don't, when `target` is set explicitly):
#   * COMPILER_PATH (env, applies to every gcc invocation incl. build scripts) →
#     gcc's collect2 finds `ld`.
#   * -Cdlltool=... → the dlltool rustc uses to build Windows import libraries.
[build]
target = "x86_64-pc-windows-gnu"
# Shared, absolute target dir so per-milestone worktrees reuse one build cache
# (the dep tree compiles once, not once per worktree). Outside any worktree.
target-dir = "C:/Users/tefenlilioe/code/zicade-rs/target"
rustflags = ["-Cdlltool=C:/Users/tefenlilioe/tools/w64devkit/bin/dlltool.exe"]

[target.x86_64-pc-windows-gnu]
linker = "C:/Users/tefenlilioe/tools/w64devkit/bin/gcc.exe"

[env]
COMPILER_PATH = "C:/Users/tefenlilioe/tools/w64devkit/bin"
