[workspace]
resolver = "3"
members = [
    "crates/zicade-config",
    "crates/zicade-routing",
    "crates/zicade-auth",
    "crates/zicade-win",
    "crates/zicade-proxy",
    "crates/zicade-control",
    "crates/zicade-ui",
    "crates/zicade-observe",
    "apps/zicade",
]

[workspace.package]
version = "0.4.0" # x-release-please-version
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.99"

# Centralized dependency versions. Individual crates opt in with
# `<dep>.workspace = true` and pull only what their tests demand (strict TDD).
[workspace.dependencies]
anyhow = "1"
windows = "0.59"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "sync",
    "time",
] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
socket2 = { version = "0.5", features = ["all"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
# The native UI. Pinned exactly: gpui-kit pins a gpui snapshot and its API
# still moves between minor releases.
gpui-kit = "=0.7.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Single lint policy for the whole workspace. Each crate opts in with
# `[lints] workspace = true`. `cargo clippy -- -D warnings` promotes every
# `warn` below to a hard error, which is how the complexity guardrails bite.
[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
large_enum_variant = "warn"
module_inception = "warn"
# Rules from the coding agreement that would otherwise live only in prose.
# `unwrap_used`/`expect_used` are not here: test helpers outside `#[test]` fns
# would trip them. CI checks them on non-test targets only (see ci.yml).
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.lints.rust]
unused_must_use = "warn"
